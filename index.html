<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Deluxe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      position: relative;
      transition: transform 0.2s;
    }
    .game-card.shake {
      animation: shake 0.3s ease-in-out;
    }
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .info-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .info-item { display: flex; flex-direction: column; align-items: center; }
    .info-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .info-value { font-size: 1.3rem; font-weight: 800; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      height: 310px;
      margin-bottom: 20px;
    }
    .tile {
      background: linear-gradient(145deg, #334155, #1e293b);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: background 0.15s, border 0.15s;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .tile:active { transform: scale(0.95); }
    .tile.safe {
      background: linear-gradient(145deg, #059669, #047857);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .tile.bomb {
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .toast {
      position: absolute;
      bottom: 80px;
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
    .modal-desc { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="game-card" id="card">
    <h1>MINES DELUXE</h1>

    <div class="info-bar">
      <div class="info-item">
        <span class="info-label">Level</span>
        <span class="info-value" id="level" style="color: #f43f5e;">1/3</span>
      </div>
      <div class="info-item">
        <span class="info-label">Gems Target</span>
        <span class="info-value" id="gems-counter" style="color: #38bdf8;">0/6</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>

    <div class="toast" id="toast">⚠️ Press START GAME first!</div>

    <div class="modal-overlay" id="modal">
      <div class="modal-icon" id="m-icon">🎉</div>
      <div class="modal-title" id="m-title">Nice one Baho</div>
      <div class="modal-desc" id="m-desc">You passed! Are you ready?</div>
      <button class="btn" id="m-btn" onclick="nextModalAction()">NEXT LEVEL</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const gemsCounterEl = document.getElementById("gems-counter");
    const startBtn = document.getElementById("start-btn");
    const modal = document.getElementById("modal");
    const toast = document.getElementById("toast");
    const card = document.getElementById("card");

    let level = 1;
    let gemsFound = 0;
    let gameActive = false;
    let isShowingBombs = false;
    let hasStartedOnce = false;
    
    let realBoard = [];
    let fakeBoard = [];
    let revealed = [];
    let toastTimeout;

    const LEVEL_REQUIREMENTS = {
      1: 6,
      2: 8,
      3: 10
    };

    const MAX_LEVEL = 3;

    function getRandomIndices(count) {
      let indices = [];
      while (indices.length < count) {
        let idx = Math.floor(Math.random() * 25);
        if (!indices.includes(idx)) {
          indices.push(idx);
        }
      }
      return indices;
    }

    function initGrid() {
      gridEl.innerHTML = "";
      revealed = Array(25).fill(false);
      gemsFound = 0;
      gameActive = false;
      isShowingBombs = false;
      hasStartedOnce = false;
      startBtn.disabled = false;
      startBtn.textContent = "START GAME";

      const target = LEVEL_REQUIREMENTS[level];
      levelEl.textContent = `${level}/${MAX_LEVEL}`;
      gemsCounterEl.textContent = `0/${target}`;

      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.classList.add("tile");
        tile.addEventListener("click", () => handleTileClick(i, tile));
        gridEl.appendChild(tile);
      }
    }

    function showWarning() {
      toast.classList.add("show");
      card.classList.add("shake");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);

      setTimeout(() => {
        card.classList.remove("shake");
      }, 300);
    }

    function startGame() {
      if (gameActive || isShowingBombs) return;

      hasStartedOnce = true;
      isShowingBombs = true;
      startBtn.disabled = true;

      // 10 FAKE BOMBS
      fakeBoard = Array(25).fill("safe");
      let fakeIndices = getRandomIndices(10);
      fakeIndices.forEach(idx => fakeBoard[idx] = "bomb");

      // 1 REAL BOMB
      realBoard = Array(25).fill("safe");
      let realIndices = getRandomIndices(1);
      realIndices.forEach(idx => realBoard[idx] = "bomb");

      const tiles = document.querySelectorAll(".tile");

      // SHOW FAKE BOMBS FOR 1 SECOND
      fakeBoard.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        }
      });

      // HIDE AFTER 1 SECOND
      setTimeout(() => {
        fakeBoard.forEach((type, idx) => {
          if (type === "bomb") {
            tiles[idx].classList.remove("bomb");
            tiles[idx].textContent = "";
          }
        });
        isShowingBombs = false;
        gameActive = true;
        startBtn.textContent = "PICK NOW!";
      }, 1000);
    }

    function handleTileClick(index, tile) {
      if (!hasStartedOnce) {
        showWarning();
        return;
      }

      if (!gameActive || isShowingBombs || revealed[index]) return;

      revealed[index] = true;
      const targetGems = LEVEL_REQUIREMENTS[level];

      if (realBoard[index] === "bomb") {
        tile.classList.add("bomb");
        tile.textContent = "💣";
        gameActive = false;
        revealAll();
        showModal("💥", "GAME OVER", `Better luck next time! Hit a bomb at Level ${level}.`, "TRY AGAIN", resetGame);
      } else {
        tile.classList.add("safe");
        tile.textContent = "💎";
        gemsFound++;
        gemsCounterEl.textContent = `${gemsFound}/${targetGems}`;

        if (gemsFound === targetGems) {
          gameActive = false;
          if (level === MAX_LEVEL) {
            revealAll();
            // FIRST STEP OF WINNING: SHOW GIFT BOX
            showModal(
              "🎁", 
              "CONGRATULATIONS!", 
              "You completed all levels! You received a gift box.", 
              "OPEN", 
              () => {
                // SECOND STEP: SHOW SURPRISE MESSAGE
                showModal(
                  "❤️", 
                  "I MISS YOU LOVELY MWUAAAAH ❤", 
                  "Thank you for playing!", 
                  "PLAY AGAIN", 
                  resetGame
                );
              }
            );
          } else {
            showModal(
              "🎉", 
              "Nice one Baho", 
              `You passed! You collected ${targetGems} Diamonds. Are you ready for Level ${level + 1}?`, 
              "NEXT LEVEL", 
              () => {
                level++;
                initGrid();
              }
            );
          }
        }
      }
    }

    function revealAll() {
      const tiles = document.querySelectorAll(".tile");
      realBoard.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        } else if (!revealed[idx]) {
          tiles[idx].style.opacity = "0.5";
          tiles[idx].textContent = "💎";
        }
      });
    }

    let nextModalAction = null;

    function showModal(icon, title, desc, btnText, action) {
      document.getElementById("m-icon").textContent = icon;
      document.getElementById("m-title").textContent = title;
      document.getElementById("m-desc").textContent = desc;
      document.getElementById("m-btn").textContent = btnText;
      nextModalAction = () => {
        modal.classList.remove("active");
        action();
      };
      setTimeout(() => modal.classList.add("active"), 300);
    }

    function resetGame() {
      level = 1;
      initGrid();
    }

    initGrid();
  </script>
</body>
</html>
