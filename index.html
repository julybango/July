<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JULY SARAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      position: relative;
      transition: transform 0.2s;
    }
    .game-card.shake {
      animation: shake 0.3s ease-in-out;
    }
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .info-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .info-item { display: flex; flex-direction: column; align-items: center; }
    .info-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .info-value { font-size: 1.3rem; font-weight: 800; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      height: 310px;
      margin-bottom: 20px;
    }
    .tile {
      background: linear-gradient(145deg, #334155, #1e293b);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: background 0.15s, border 0.15s;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .tile:active { transform: scale(0.95); }
    .tile.safe {
      background: linear-gradient(145deg, #059669, #047857);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .tile.bomb {
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .toast {
      position: absolute;
      bottom: 80px;
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .modal-icon { 
      font-size: 4rem; 
      margin-bottom: 10px; 
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.6));
    }

    .modal-icon.float-glow {
      animation: floatGlow 2.5s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.6));
      }
      50% {
        transform: translateY(-8px) scale(1.08);
        filter: drop-shadow(0 0 25px rgba(251, 113, 133, 0.9));
      }
    }
    
    .modal-icon.open-gift {
      animation: giftPop 0.4s ease-in-out;
    }

    @keyframes giftPop {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.3) rotate(-10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; line-height: 1.3; }
    .modal-desc { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; }
    .modal-desc:empty { display: none; margin-bottom: 0; }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4) !important;
    }

    .music-player-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 15px;
      border-radius: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Romantic Music Source -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/ambiences/romantic_theme.ogg" type="audio/ogg">
  </audio>

  <div class="game-card" id="card">
    <h1>JULY SARAP</h1>

    <div class="info-bar">
      <div class="info-item">
        <span class="info-label">Level</span>
        <span class="info-value" id="level" style="color: #f43f5e;">1/3</span>
      </div>
      <div class="info-item">
        <span class="info-label">Gems Target</span>
        <span class="info-value" id="gems-counter" style="color: #38bdf8;">0/6</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>

    <div class="toast" id="toast">⚠️ Press START GAME first!</div>

    <div class="modal-overlay" id="modal">
      <div class="modal-content" id="m-content">
        <div class="modal-icon" id="m-icon">🎉</div>
        <div class="modal-title" id="m-title">Nice one Baho</div>
        <div class="modal-desc" id="m-desc">You passed! Are you ready?</div>
        
        <!-- Interactive Play Music Button container -->
        <div id="music-container" style="display:none; width: 100%;">
          <div class="music-player-box">
            <span style="font-size: 1.2rem;">🎶</span>
            <span style="font-size: 0.85rem; color: #f1f5f9; flex: 1; text-align: left;">I-play ang kanta para mas sweet!</span>
            <button class="btn" id="play-music-btn" onclick="manualPlayMusic()" style="padding: 6px 12px; font-size: 0.8rem; width: auto;">PLAY 🎵</button>
          </div>
        </div>

        <button class="btn" id="m-btn" onclick="nextModalAction()">NEXT LEVEL</button>
      </div>
    </div>
  </div>

  <script>
    const bgMusic = document.getElementById("bg-music");
    const musicContainer = document.getElementById("music-container");
    const playMusicBtn = document.getElementById("play-music-btn");

    function playMusic() {
      bgMusic.currentTime = 0;
      bgMusic.play().then(() => {
        musicContainer.style.display = "none";
      }).catch(e => {
        // Kung sakaling i-block ng browser, lalabas ang Play button para siya ang mag-click
        musicContainer.style.display = "block";
      });
    }

    function manualPlayMusic() {
      bgMusic.play().then(() => {
        musicContainer.style.display = "none";
      });
    }

    function stopMusic() {
      bgMusic.pause();
      bgMusic.currentTime = 0;
      musicContainer.style.display = "none";
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'gem') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'bomb') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'start') {
        [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.2, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.1);
        });
      } else if (type === 'warn') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.2);
        });
      }
    }

    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const gemsCounterEl = document.getElementById("gems-counter");
    const startBtn = document.getElementById("start-btn");
    const modal = document.getElementById("modal");
    const mContent = document.getElementById("m-content");
    const mIcon = document.getElementById("m-icon");
    const mBtn = document.getElementById("m-btn");
    const toast = document.getElementById("toast");
    const card = document.getElementById("card");

    let level = 1;
    let gemsFound = 0;
    let gameActive = false;
    let isShowingBombs = false;
    let hasStartedOnce = false;
    
    let realBoard = [];
    let fakeBoard = [];
    let revealed = [];
    let toastTimeout;

    const LEVEL_REQUIREMENTS = {
      1: 6,
      2: 8,
      3: 10
    };

    const MAX_LEVEL = 3;

    function getRandomIndices(count) {
      let indices = [];
      while (indices.length < count) {
        let idx = Math.floor(Math.random() * 25);
        if (!indices.includes(idx)) {
          indices.push(idx);
        }
      }
      return indices;
    }

    function initGrid() {
      gridEl.innerHTML = "";
      revealed = Array(25).fill(false);
      gemsFound = 0;
      gameActive = false;
      isShowingBombs = false;
      hasStartedOnce = false;
      startBtn.disabled = false;
      startBtn.textContent = "START GAME";

      const target = LEVEL_REQUIREMENTS[level];
      levelEl.textContent = `${level}/${MAX_LEVEL}`;
      gemsCounterEl.textContent = `0/${target}`;

      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.classList.add("tile");
        tile.addEventListener("click", () => handleTileClick(i, tile));
        gridEl.appendChild(tile);
      }
    }

    function showWarning() {
      playSound('warn');
      toast.classList.add("show");
      card.classList.add("shake");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);

      setTimeout(() => {
        card.classList.remove("shake");
      }, 300);
    }

    function startGame() {
      if (gameActive || isShowingBombs) return;

      playSound('start');
      hasStartedOnce = true;
      isShowingBombs = true;
      startBtn.disabled = true;

      fakeBoard = Array(25).fill("safe");
      let fakeIndices = getRandomIndices(10);
      fakeIndices.forEach(idx => fakeBoard[idx] = "bomb");

      realBoard = Array(25).fill("safe");
      let realIndices = getRandomIndices(1);
      realIndices.forEach(idx => realBoard[idx] = "bomb");

      const tiles = document.querySelectorAll(".tile");

      fakeBoard.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        }
      });

      setTimeout(() => {
        fakeBoard.forEach((type, idx) => {
          if (type === "bomb") {
            tiles[idx].classList.remove("bomb");
            tiles[idx].textContent = "";
          }
        });
        isShowingBombs = false;
        gameActive = true;
        startBtn.textContent = "PICK NOW!";
      }, 1000);
    }

    function handleTileClick(index, tile) {
      if (!hasStartedOnce) {
        showWarning();
        return;
      }

      if (!gameActive || isShowingBombs || revealed[index]) return;

      revealed[index] = true;
      const targetGems = LEVEL_REQUIREMENTS[level];

      if (realBoard[index] === "bomb") {
        playSound('bomb');
        tile.classList.add("bomb");
        tile.textContent = "💣";
        gameActive = false;
        revealAll();
        showModal("💥", "GAME OVER", `Better luck next time! Hit a bomb at Level ${level}.`, "TRY AGAIN", resetGame);
      } else {
        playSound('gem');
        tile.classList.add("safe");
        tile.textContent = "💎";
        gemsFound++;
        gemsCounterEl.textContent = `${gemsFound}/${targetGems}`;

        if (gemsFound === targetGems) {
          gameActive = false;
          playSound('win');
          if (level === MAX_LEVEL) {
            revealAll();
            showModal(
              "🎁", 
              "CONGRATULATIONS!", 
              "You completed all levels! You received a gift box.", 
              "OPEN", 
              () => {
                openGiftAnimation(() => {
                  playMusic(); // Auto-play attempt
                  showModal(
                    "🌹", 
                    "I MISS YOU LOVELY ❤️<br>MWUAAAAH 😚", 
                    "", 
                    "I MISS YOU MORE!", 
                    () => {
                      stopMusic(); 
                      resetGame();
                    },
                    true
                  );
                });
              }
            );
          } else {
            showModal(
              "🎉", 
              "Nice one Baho", 
              `You passed! You collected ${targetGems} Diamonds. Are you ready for Level ${level + 1}?`, 
              "NEXT LEVEL", 
              () => {
                modal.classList.remove("active");
                level++;
                initGrid();
              }
            );
          }
        }
      }
    }

    function revealAll() {
      const tiles = document.querySelectorAll(".tile");
      realBoard.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        } else if (!revealed[idx]) {
          tiles[idx].style.opacity = "0.5";
          tiles[idx].textContent = "💎";
        }
      });
    }

    let nextModalAction = null;

    function showModal(icon, title, desc, btnText, action, isSpecial = false) {
      mIcon.textContent = icon;
      document.getElementById("m-title").innerHTML = title;
      document.getElementById("m-desc").textContent = desc;
      mBtn.textContent = btnText;
      
      // I-reset muna ang music container bago buksan ang modal
      musicContainer.style.display = "none";

      if (isSpecial) {
        mIcon.classList.add("float-glow");
        mBtn.classList.add("btn-gold");
      } else {
        mIcon.classList.remove("float-glow");
        mBtn.classList.remove("btn-gold");
      }

      nextModalAction = () => {
        action();
      };

      modal.classList.add("active");
      mContent.style.transform = "scale(1)";
      mContent.style.opacity = "1";
    }

    function openGiftAnimation(callback) {
      mIcon.classList.add("open-gift");
      mContent.style.transform = "scale(0.8)";
      mContent.style.opacity = "0";

      setTimeout(() => {
        mIcon.classList.remove("open-gift");
        callback();
      }, 300);
    }

    function resetGame() {
      modal.classList.remove("active");
      level = 1;
      initGrid();
    }

    initGrid();
  </script>
</body>
</html>
