<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Mines</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      position: relative;
    }
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .info-bar {
      display: flex;
      justify-content: center;
      width: 100%;
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .info-item { display: flex; flex-direction: column; align-items: center; }
    .info-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .info-value { font-size: 1.3rem; font-weight: 800; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1;
      margin-bottom: 20px;
    }
    .tile {
      background: linear-gradient(145deg, #334155, #1e293b);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .tile:active { transform: scale(0.95); }
    .tile.safe {
      background: linear-gradient(145deg, #059669, #047857);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .tile.bomb {
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    
    @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Modal Popup */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
    .modal-desc { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>MINES DELUXE</h1>

    <div class="info-bar">
      <div class="info-item">
        <span class="info-label">Level</span>
        <span class="info-value" id="level" style="color: #f43f5e;">1/5</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modal">
      <div class="modal-icon" id="m-icon">🎉</div>
      <div class="modal-title" id="m-title">LEVEL PASSED!</div>
      <div class="modal-desc" id="m-desc">Nakakuha ka ng 3 Diyamante!</div>
      <button class="btn" id="m-btn" onclick="nextModalAction()">TUMULOY</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const startBtn = document.getElementById("start-btn");
    const modal = document.getElementById("modal");

    let level = 1;
    let gemsFound = 0;
    let gameActive = false;
    let isMemorizing = false;
    let board = [];
    let revealed = [];

    const bombLevels = [2, 4, 6, 8, 10]; 

    function initGrid() {
      gridEl.innerHTML = "";
      board = Array(25).fill("safe");
      revealed = Array(25).fill(false);
      gemsFound = 0;
      gameActive = false;
      isMemorizing = false;
      startBtn.disabled = false;
      startBtn.textContent = "START GAME";

      let totalBombs = bombLevels[level - 1];
      levelEl.textContent = `${level}/5`;

      // Maglagay ng random bombs
      let bombsPlaced = 0;
      while (bombsPlaced < totalBombs) {
        let idx = Math.floor(Math.random() * 25);
        if (board[idx] === "safe") {
          board[idx] = "bomb";
          bombsPlaced++;
        }
      }

      // Gumawa ng malilinis na tiles
      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.classList.add("tile");
        tile.addEventListener("click", () => handleTileClick(i, tile));
        gridEl.appendChild(tile);
      }
    }

    function startGame() {
      if (gameActive || isMemorizing) return;

      isMemorizing = true;
      startBtn.disabled = true;
      startBtn.textContent = "ULUHIN ANG MGA BOMBA...";

      const tiles = document.querySelectorAll(".tile");

      // WALANG TAKIP: Ipakita ang lahat ng bomba para maulo ng player
      board.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        }
      });

      // Pagkalipas ng 3 segundo, tatakpan ulit para magsimula ang laro!
      setTimeout(() => {
        board.forEach((type, idx) => {
          if (type === "bomb") {
            tiles[idx].classList.remove("bomb");
            tiles[idx].textContent = "";
          }
        });
        isMemorizing = false;
        gameActive = true;
        startBtn.textContent = "MAMILI NA!";
      }, 3000);
    }

    function handleTileClick(index, tile) {
      if (!gameActive || isMemorizing || revealed[index]) return;

      revealed[index] = true;

      if (board[index] === "bomb") {
        tile.classList.add("bomb");
        tile.textContent = "💣";
        gameActive = false;
        revealAll();
        showModal("💥", "NATATAYA KA!", `Bumangga ka sa bomba sa Level ${level}.`, "ULITIN", resetGame);
      } else {
        tile.classList.add("safe");
        tile.textContent = "💎";
        gemsFound++;

        if (gemsFound === 3) {
          gameActive = false;
          if (level === 5) {
            revealAll();
            showModal("🏆", "PANALO KA!", "Nalagpasan mo ang lahat ng 5 Levels!", "LARO ULIT", resetGame);
          } else {
            showModal("🎉", "LEVEL PASSED!", `Handa ka na sa Level ${level + 1}?`, "SUNOD NA LEVEL", () => {
              level++;
              initGrid();
            });
          }
        }
      }
    }

    function revealAll() {
      const tiles = document.querySelectorAll(".tile");
      board.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        } else if (!revealed[idx]) {
          tiles[idx].style.opacity = "0.5";
          tiles[idx].textContent = "💎";
        }
      });
    }

    let nextModalAction = null;

    function showModal(icon, title, desc, btnText, action) {
      document.getElementById("m-icon").textContent = icon;
      document.getElementById("m-title").textContent = title;
      document.getElementById("m-desc").textContent = desc;
      document.getElementById("m-btn").textContent = btnText;
      nextModalAction = () => {
        modal.classList.remove("active");
        action();
      };
      setTimeout(() => modal.classList.add("active"), 300);
    }

    function resetGame() {
      level = 1;
      initGrid();
    }

    initGrid();
  </script>
</body>
</html>
