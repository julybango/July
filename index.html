<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Game - 5 Levels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
    .info { 
      display: flex; 
      gap: 15px; 
      font-size: 1.1rem; 
      color: #94a3b8; 
      margin-bottom: 15px; 
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 8px;
      margin-bottom: 15px;
    }
    .tile {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tile:hover { background-color: #334155; }
    .tile.safe { background-color: #065f46; border-color: #10b981; }
    .tile.bomb { background-color: #991b1b; border-color: #ef4444; }
    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>

  <h1>Mines Game (5 Levels)</h1>
  <div class="info">
    <div>Level: <span id="level" style="color:#f43f5e; font-weight:bold;">1/5</span></div>
    <div>Bomba: <span id="bomb-count" style="color:#eab308; font-weight:bold;">2</span></div>
    <div>Score: <span id="score" style="color:#38bdf8; font-weight:bold;">0</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="btn" onclick="resetGame()">Bagong Laro</button>

  <script>
    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const bombCountEl = document.getElementById("bomb-count");
    const scoreEl = document.getElementById("score");
    
    let level = 1;
    let score = 0;
    let gemsFoundInLevel = 0;
    let gameOver = false;
    
    let board = [];
    let revealed = [];

    // Bilang ng bomba kada level: Level 1=2, Level 2=4, Level 3=6, Level 4=8, Level 5=10
    const bombLevels = [2, 4, 6, 8, 10]; 

    function startLevel() {
      gridEl.innerHTML = "";
      board = Array(25).fill("safe");
      revealed = Array(25).fill(false);
      gemsFoundInLevel = 0;
      gameOver = false;

      let totalBombs = bombLevels[level - 1];
      levelEl.textContent = `${level}/5`;
      bombCountEl.textContent = totalBombs;

      // Maglagay ng bomba sa random tiles
      let bombsPlaced = 0;
      while (bombsPlaced < totalBombs) {
        let idx = Math.floor(Math.random() * 25);
        if (board[idx] === "safe") {
          board[idx] = "bomb";
          bombsPlaced++;
        }
      }

      // Gawa ng grid tiles
      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.classList.add("tile");
        tile.addEventListener("click", () => handleTileClick(i, tile));
        gridEl.appendChild(tile);
      }
    }

    function handleTileClick(index, tile) {
      if (gameOver || revealed[index]) return;

      revealed[index] = true;

      // Kapag Bomba ang Napindot (TAYA!)
      if (board[index] === "bomb") {
        tile.classList.add("bomb");
        tile.textContent = "💣";
        gameOver = true;
        revealAll();
        setTimeout(() => alert(`NATATAYA KA! 💥\nBumangga ka sa bomba sa Level ${level}.\nFinal Score: ${score}`), 100);
      } 
      // Kapag Diyamante / Safe
      else {
        tile.classList.add("safe");
        tile.textContent = "💎";
        score += 10 * level;
        gemsFoundInLevel++;
        scoreEl.textContent = score;

        // Kinaipangan makakolekta ng 3 Diyamante para pumasa sa Level
        if (gemsFoundInLevel === 3) {
          gameOver = true;
          if (level === 5) {
            revealAll();
            setTimeout(() => alert(`🎉 PANALO KA SA BUONG LARO!\nNalagpasan mo ang lahat ng 5 Levels!\nTotal Score: ${score}`), 100);
          } else {
            setTimeout(() => {
              alert(`NICE! Pumasa ka sa Level ${level}! Handa ka na sa Level ${level + 1}?`);
              level++;
              startLevel();
            }, 100);
          }
        }
      }
    }

    function revealAll() {
      const tiles = document.querySelectorAll(".tile");
      board.forEach((type, idx) => {
        if (type === "bomb") {
          tiles[idx].classList.add("bomb");
          tiles[idx].textContent = "💣";
        } else {
          tiles[idx].classList.add("safe");
          tiles[idx].textContent = "💎";
        }
      });
    }

    function resetGame() {
      level = 1;
      score = 0;
      scoreEl.textContent = "0";
      startLevel();
    }

    startLevel();
  </script>
</body>
</html>
