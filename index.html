<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JULY SARAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden; /* Iwasan ang scrollbar */
    }
    .game-card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      position: relative;
    }
    h1 { font-size: 1.8rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; font-weight: 800; }
    .info-bar { display: flex; justify-content: space-around; width: 100%; background: #0f172a; padding: 10px 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    .info-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
    .info-value { font-size: 1.3rem; font-weight: 800; }
    
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; width: 100%; height: 310px; margin-bottom: 20px; }
    .tile { background: linear-gradient(145deg, #334155, #1e293b); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255, 255, 255, 0.05); }
    .tile.safe { background: linear-gradient(145deg, #059669, #047857); }
    .tile.bomb { background: linear-gradient(145deg, #dc2626, #b91c1c); }
    
    .btn { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #0f172a; border: none; padding: 14px; font-size: 1rem; font-weight: 800; border-radius: 12px; cursor: pointer; }
    .btn:disabled { background: #334155; color: #64748b; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>JULY SARAP</h1>
    <div class="info-bar">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <span class="info-label">Level</span>
        <span class="info-value" id="level" style="color: #f43f5e;">1/3</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <span class="info-label">Target</span>
        <span class="info-value" id="gems-counter" style="color: #38bdf8;">0/6</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div id="m-icon" style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
      <h2 id="m-title" style="margin-bottom: 10px;">Success!</h2>
      <p id="m-desc" style="color: #94a3b8; margin-bottom: 20px;"></p>
      <button class="btn" id="m-btn" onclick="closeModal()">NEXT</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const gemsCounterEl = document.getElementById("gems-counter");
    const startBtn = document.getElementById("start-btn");
    const modal = document.getElementById("modal");

    let level = 1, gemsFound = 0, gameActive = false, revealed = [];
    const LEVELS = { 1: 6, 2: 8, 3: 10 };

    function initGrid() {
      gridEl.innerHTML = "";
      revealed = Array(25).fill(false);
      gemsFound = 0;
      gameActive = false;
      startBtn.disabled = false;
      startBtn.textContent = "START GAME";
      levelEl.textContent = `${level}/3`;
      gemsCounterEl.textContent = `0/${LEVELS[level]}`;
      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.onclick = () => handleTileClick(i, tile);
        gridEl.appendChild(tile);
      }
    }

    function startGame() {
      gameActive = true;
      startBtn.disabled = true;
      startBtn.textContent = "PICK NOW!";
      // Pre-define logic here...
    }

    function handleTileClick(i, tile) {
      if (!gameActive || revealed[i]) return;
      revealed[i] = true;
      tile.classList.add("safe");
      tile.textContent = "💎";
      gemsFound++;
      gemsCounterEl.textContent = `${gemsFound}/${LEVELS[level]}`;
      
      if (gemsFound >= LEVELS[level]) {
        gameActive = false;
        showModal("You did it!", "Good job, you cleared this round!");
      }
    }

    function showModal(title, desc) {
      document.getElementById("m-title").textContent = title;
      document.getElementById("m-desc").textContent = desc;
      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
      if (level < 3) { level++; initGrid(); }
      else { level = 1; initGrid(); }
    }

    initGrid();
  </script>
</body>
</html>
