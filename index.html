<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter - Leveling Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      touch-action: manipulation;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
    .info-bar {
      display: flex;
      gap: 15px;
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .highlight { color: #38bdf8; font-weight: bold; }
    .danger { color: #f43f5e; font-weight: bold; }
    canvas {
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .btn {
      margin-top: 15px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <h1>Space Shooter</h1>
  <div class="info-bar">
    <div>Level: <span id="level" class="danger">1</span></div>
    <div>Score: <span id="score" class="highlight">0</span></div>
    <div>Buhay: <span id="lives" class="highlight">3</span></div>
  </div>

  <canvas id="gameCanvas" width="360" height="480"></canvas>
  
  <div class="controls-hint">Controls: Left/Right Arrow o Mouse/Touch para gumalaw | Auto-Fire</div>
  <button class="btn" onclick="resetGame()">Bagong Laro</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let level = 1;
    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Player Ship
    let player = { x: 160, y: 420, w: 40, h: 20, speed: 5 };

    // Game Arrays
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let boss = null;

    let keys = {};
    let frame = 0;

    function startLevel() {
      enemies = [];
      boss = null;
      bullets = [];
      enemyBullets = [];

      // Pag BOSS Level (Kada Level 3, 6, 9...)
      if (level % 3 === 0) {
        boss = {
          x: 130, y: 40, w: 100, h: 50,
          hp: level * 20,
          maxHp: level * 20,
          dx: 2 + level * 0.5
        };
      } else {
        // Regular Enemies (Mas madami habang tumataas ang Level)
        let rows = Math.min(2 + level, 5);
        let cols = 5;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            enemies.push({
              x: 30 + c * 60,
              y: 40 + r * 40,
              w: 30, h: 20,
              hp: 1 + Math.floor(level / 2)
            });
          }
        }
      }
    }

    function gameLoop() {
      if (gameOver) return;

      frame++;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      // Galaw ng Player (Keyboard)
      if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
      if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;

      // Auto-Shoot ng Player (Kada 15 frames)
      if (frame % 15 === 0) {
        bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12 });
      }

      // Galaw ng Bala ng Player
      bullets.forEach((b, i) => {
        b.y -= 7;
        if (b.y < 0) bullets.splice(i, 1);
      });

      // Galaw ng Bala ng Kalaban
      enemyBullets.forEach((eb, i) => {
        eb.y += 4 + level * 0.5; // Bumibilis ang bala ng kalaban kada level

        // Tama sa Player
        if (eb.x < player.x + player.w && eb.x + eb.w > player.x &&
            eb.y < player.y + player.h && eb.y + eb.h > player.y) {
          enemyBullets.splice(i, 1);
          lives--;
          document.getElementById("lives").textContent = lives;
          if (lives <= 0) endGame();
        }

        if (eb.y > canvas.height) enemyBullets.splice(i, 1);
      });

      // --- REGULAR ENEMIES LOGIC ---
      enemies.forEach((e, ei) => {
        // Kalaban na nag-ti-trigger mag-shoot (Pahirap nang pahirap)
        if (Math.random() < 0.002 * level) {
          enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 4, h: 8 });
        }

        // Tamaan ng bala ang regular enemy
        bullets.forEach((b, bi) => {
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            bullets.splice(bi, 1);
            e.hp--;
            if (e.hp <= 0) {
              enemies.splice(ei, 1);
              score += 10 * level;
              document.getElementById("score").textContent = score;
            }
          }
        });
      });

      // --- BOSS LOGIC ---
      if (boss) {
        boss.x += boss.dx;
        if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.dx *= -1;

        // Boss Fire (Pahirap nang pahirap)
        if (frame % Math.max(20, 60 - level * 5) === 0) {
          enemyBullets.push({ x: boss.x + 20, y: boss.y + boss.h, w: 6, h: 10 });
          enemyBullets.push({ x: boss.x + boss.w - 20, y: boss.y + boss.h, w: 6, h: 10 });
        }

        // Tamaan ng bala ang Boss
        bullets.forEach((b, bi) => {
          if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
            bullets.splice(bi, 1);
            boss.hp--;
            score += 5;
            document.getElementById("score").textContent = score;
            if (boss.hp <= 0) {
              boss = null;
              score += 500;
            }
          }
        });
      }

      // CLEAR LEVEL CHECK (Kapag naubos ang kalaban o Boss)
      if (enemies.length === 0 && !boss) {
        level++;
        document.getElementById("level").textContent = level;
        alert(`LEVEL COMPLETED! Handa ka na sa Level ${level}?`);
        startLevel();
      }
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Player Bullets
      ctx.fillStyle = "#facc15";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemy Bullets
      ctx.fillStyle = "#f43f5e";
      enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

      // Regular Enemies
      ctx.fillStyle = "#a855f7";
      enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

      // Boss Enemy + Health Bar
      if (boss) {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        
        // Boss HP Bar
        ctx.fillStyle = "#334155";
        ctx.fillRect(boss.x, boss.y - 10, boss.w, 6);
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(boss.x, boss.y - 10, (boss.w * (boss.hp / boss.maxHp)), 6);
      }
    }

    function endGame() {
      gameOver = true;
      alert(`GAME OVER!\nInabot ka hanggang Level ${level}\nFinal Score: ${score}`);
    }

    function resetGame() {
      level = 1;
      score = 0;
      lives = 3;
      gameOver = false;
      document.getElementById("level").textContent = "1";
      document.getElementById("score").textContent = "0";
      document.getElementById("lives").textContent = "3";
      startLevel();
      gameLoop();
    }

    // Event Listeners for Controls
    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    // Mouse / Touch Controls para sa Mobile
    canvas.addEventListener("mousemove", e => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left - player.w / 2;
    });
    canvas.addEventListener("touchmove", e => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.touches[0].clientX - rect.left - player.w / 2;
    });

    resetGame();
  </script>
</body>
</html>
